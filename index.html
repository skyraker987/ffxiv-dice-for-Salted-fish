<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FFXIV 职能同步随机骰子</title>
    <style>
        :root {
            --bg-color: #232323; --card-bg: #333; --text-color: #e0e0e0;
            --t-color: #4169e1; --h-color: #32cd32; --d-color: #dc143c; --accent: #f39c12;
        }
        body { font-family: "Microsoft YaHei", sans-serif; background: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 600px; width: 100%; }
        .status-bar { font-size: 0.8rem; margin-bottom: 10px; color: #888; text-align: right; }
        .config-panel, .player-card { background: var(--card-bg); border-radius: 8px; padding: 15px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        select, input, button { background: #444; color: #fff; border: 1px solid #666; padding: 8px; border-radius: 4px; }
        button { background: var(--accent); border: none; cursor: pointer; font-weight: bold; width: 100%; font-size: 1.1rem; padding: 12px; margin-top: 10px; transition: 0.2s; }
        button:hover { filter: brightness(1.2); }
        .player-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #555; padding-bottom: 8px; margin-bottom: 10px; }
        .job-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 0.85rem; }
        .job-item { display: flex; align-items: center; justify-content: space-between; }
        .job-item input { width: 45px; text-align: center; }
        .result-box { background: #1a1a1a; border: 2px solid var(--accent); padding: 15px; border-radius: 8px; margin-top: 20px; display: none; }
        .res-row { display: flex; justify-content: space-between; margin: 5px 0; padding: 8px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.1); }
        .res-t { border-left: 5px solid var(--t-color); background: rgba(65, 105, 225, 0.1); }
        .res-h { border-left: 5px solid var(--h-color); background: rgba(50, 205, 50, 0.1); }
        .res-d { border-left: 5px solid var(--d-color); background: rgba(220, 20, 60, 0.1); }
        .res-bench { border-left: 5px solid #888; background: #222; opacity: 0.6; }
    </style>
</head>
<body>

<div class="container">
    <div id="syncStatus" class="status-bar">正在检查云端同步...</div>
    <div class="config-panel">
        <label>副本模式：</label>
        <select id="dungeonType" style="width: 100%; margin-top: 8px;">
            <option value="4,1,1,2,18">4人普通 (18+)</option>
            <option value="4,1,1,2,100">4人满级 (100)</option>
            <option value="8,2,2,4,18">8人讨伐 (18+)</option>
            <option value="99,99,99,99,1">自由模式</option>
        </select>
        <button onclick="pushData()" style="background: #2980b9; font-size: 0.9rem; padding: 5px; margin-top: 10px;">手动同步到云端</button>
    </div>

    <div id="playersContainer">加载中...</div>
    
    <button onclick="addPlayer()" style="background: #555;">+ 添加队员</button>
    <button onclick="roll()" style="background: #e67e22; margin-top: 20px;">开始掷骰 (全员同步)</button>

    <div id="result" class="result-box"></div>
</div>

<script>
    // --- 配置区域 ---
    const BIN_ID = "8befa6aaad668274c166"; // <--- 替换成你刚才申请的 ID
    const API_URL = `https://api.npoint.io/${BIN_ID}`;

    const JOB_DATA = {
        T: ["骑士", "战士", "暗黑骑士", "绝枪战士"],
        H: ["白魔法师", "学者", "占星术士", "贤者"],
        D: ["武僧", "龙骑士", "忍者", "武士", "钐镰客", "蝰蛇", "吟游诗人", "机工士", "舞者", "黑魔法师", "召唤师", "赤魔法师", "绘灵法师"]
    };

    let players = [];

    // --- 云端数据交互 ---
    async function fetchData() {
        showStatus("正在下载云端配置...");
        try {
            const res = await fetch(API_URL);
            const data = await res.json();
            players = data.players || [];
            renderPlayers();
            showStatus("同步成功 (云端数据)");
        } catch (e) {
            showStatus("同步失败，使用本地缓存");
            players = JSON.parse(localStorage.getItem('ffxiv_v2_players')) || [];
            renderPlayers();
        }
    }

async function pushData() {
    showStatus("正在同步到云端...");
    // 也要存在本地，防止云端挂了
    localStorage.setItem('ffxiv_v2_players', JSON.stringify(players));
    
    try {
        const response = await fetch(API_URL, {
            method: 'POST', // 如果 POST 不行，试着改成 'PUT'
            headers: { 
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ players: players }) // 确保外层有 players 键
        });

        if (response.ok) {
            showStatus("已实时同步至云端");
        } else {
            const errorText = await response.text();
            showStatus("云端拒绝保存: " + response.status);
            console.error("同步失败详情:", errorText);
        }
    } catch (e) {
        showStatus("网络连接异常 (VPN?)");
        console.error(e);
    }
}

    function showStatus(msg) {
        document.getElementById('syncStatus').innerText = msg;
    }

    // --- 界面与逻辑 ---
    function renderPlayers() {
        const container = document.getElementById('playersContainer');
        container.innerHTML = '';
        players.forEach((p, pIdx) => {
            const card = document.createElement('div');
            card.className = 'player-card';
            card.innerHTML = `
                <div class="player-header">
                    <input type="text" value="${p.name}" onchange="players[${pIdx}].name=this.value;pushData()">
                    <label><input type="checkbox" ${p.online ? 'checked' : ''} onchange="players[${pIdx}].online=this.checked;pushData()"> 在线</label>
                </div>
                <div class="job-inputs">
                    ${Object.keys(JOB_DATA).map(role => 
                        JOB_DATA[role].map(job => `
                            <div class="job-item">
                                <span style="color:${role==='T'?'#4169e1':role==='H'?'#32cd32':'#dc143c'}">${job}</span>
                                <input type="number" value="${p.levels[job] || 0}" onchange="updateLevel(${pIdx}, '${job}', this.value)">
                            </div>
                        `).join('')
                    ).join('')}
                </div>
            `;
            container.appendChild(card);
        });
    }

    function updateLevel(pIdx, job, val) {
        players[pIdx].levels[job] = parseInt(val) || 0;
        pushData();
    }

    function addPlayer() {
        players.push({ name: `新队友`, online: true, levels: {} });
        renderPlayers();
        pushData();
    }

    // 核心算法 (保留之前的回溯算法)
    function roll() {
        // ... (此处逻辑与上个版本相同)
        // 关键点：在执行 roll 之前，建议先执行一次 fetchData() 保证数据是最新的
        const config = document.getElementById('dungeonType').value.split(',');
        const limit = { total: +config[0], T: +config[1], H: +config[2], D: +config[3], minLvl: +config[4] };
        const onlineList = players.filter(p => p.online);
        
        if (onlineList.length === 0) return alert("无人在线！");
        const benchNeeded = Math.max(0, onlineList.length - limit.total);
        const playerPool = onlineList.map(p => {
            let options = [];
            for(let role in JOB_DATA) {
                JOB_DATA[role].forEach(job => {
                    if ((p.levels[job] || 0) >= limit.minLvl) options.push({job, role});
                });
            }
            if (benchNeeded > 0) options.push({ job: "轮空待命", role: "BENCH" });
            options.sort(() => Math.random() - 0.5);
            return { name: p.name, options };
        });

        playerPool.sort(() => Math.random() - 0.5);
        let finalResults = [];
        let success = false;

        function solve(idx, curT, curH, curD, curB) {
            if (idx === playerPool.length) { success = true; return true; }
            const p = playerPool[idx];
            for (let choice of p.options) {
                if (choice.role === 'T' && curT >= limit.T) continue;
                if (choice.role === 'H' && curH >= limit.H) continue;
                if (choice.role === 'D' && curD >= limit.D) continue;
                if (choice.role === 'BENCH' && curB >= benchNeeded) continue;
                finalResults.push({ name: p.name, job: choice.job, role: choice.role });
                if (solve(idx + 1, choice.role === 'T'?curT+1:curT, choice.role === 'H'?curH+1:curH, choice.role === 'D'?curD+1:curD, choice.role === 'BENCH'?curB+1:curB)) return true;
                finalResults.pop();
            }
            return false;
        }

        solve(0, 0, 0, 0, 0);
        const resDiv = document.getElementById('result');
        resDiv.style.display = 'block';
        if (success) {
            finalResults.sort((a, b) => (a.role === 'BENCH' ? 1 : -1));
            resDiv.innerHTML = `<h3>匹配成功：</h3>` + finalResults.map(r => `<div class="res-row res-${r.role.toLowerCase()}"><span>${r.name}</span><span>${r.job}</span></div>`).join('');
        } else {
            resDiv.innerHTML = "匹配失败，职业池太浅了！";
        }
    }

    // 页面加载时拉取数据
    fetchData();
</script>
</body>
</html>
